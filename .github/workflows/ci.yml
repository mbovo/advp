# Test and build every branch except main, and every pull request when it is
# opened or updated. Merges to main are handled by release.yml.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
