# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: advp

before:
  hooks:
    - go mod tidy

builds:
  - id: advp
    main: ./cmd/advp
    binary: advp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mbovo/advp/internal/version.Version={{ .Version }}
      - -X github.com/mbovo/advp/internal/version.Commit={{ .FullCommit }}
      - -X github.com/mbovo/advp/internal/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
